    reference_modes: [t2v, i2v]
    strengths: [top realism, native audio, camera control, physics]
    weaknesses: [most expensive, arabic on-screen poor]
    arabic_text: poor
    relative_cost: high
    cost_tier: final
    best_for: [hero-video-ad final render from approved keyframe (i2v)]
    max_len_s: 8
    verify_live: true

  - id: veo3-fast                  # cheaper/faster Veo3
    provider: google
    reference_modes: [t2v, i2v]
    strengths: [Veo-family quality, much cheaper, fast]
    weaknesses: [slightly less fidelity than veo3]
    arabic_text: poor
    relative_cost: medium
    cost_tier: iterate
    best_for: [lp-microvideo loops, motion tests, cheaper hero variants]
    max_len_s: 8
    verify_live: true

  - id: kling                      # Kuaishou Kling (2.x) — strong i2v
    provider: kuaishou
    reference_modes: [i2v, t2v]
    strengths: [excellent image-to-video, motion coherence, cost-effective, start+end frame]
    weaknesses: [audio limited]
    arabic_text: n/a (text in post)
    relative_cost: medium
    cost_tier: iterate
    best_for: [i2v hero animation, product motion, start/end-frame LOOPS for lp microvideo]
    max_len_s: 10
    verify_live: true

  - id: runway-gen                 # Runway Gen-3/4
    provider: runway
    reference_modes: [i2v, t2v]
    strengths: [motion brush, camera control, director-grade control]
    weaknesses: [cost]
    arabic_text: n/a
    relative_cost: high
    cost_tier: final
    best_for: [precise camera moves on the hero]
    max_len_s: 10
    verify_live: true

  - id: hailuo                     # MiniMax Hailuo
    provider: minimax
    reference_modes: [i2v, t2v]
    strengths: [natural motion, cheap, good i2v]
    weaknesses: [less camera control]
    arabic_text: n/a
    relative_cost: low
    cost_tier: draft
    best_for: [cheap motion drafts, microvideo loops]
    max_len_s: 6
    verify_live: true

  - id: seedance                   # ByteDance video
    provider: bytedance
    reference_modes: [i2v, t2v]
    strengths: [smooth, cost-effective, good product motion]
    weaknesses: [newer, verify availability]
    arabic_text: n/a
    relative_cost: low
    cost_tier: draft
    best_for: [microvideo loops, cheap i2v]
    max_len_s: 5
    verify_live: true

upscale_models:
  - id: kie-upscaler               # generic upscale/enhance (verify exact model on Kie)
    reference_modes: [upscale]
    strengths: [resolution + detail on an approved render]
    relative_cost: low
    cost_tier: draft
    best_for: [take an approved draft → final resolution WITHOUT re-generating]
    verify_live: true

# ═══════════════════════════════════════════════════════════════════════════════
# ROUTING MATRIX  — how the format-router picks, in BALANCED mode (owner default)
# HARD RULE: any asset whose subject is the product MUST use a reference-capable
# route (i2i/edit/inpaint/bg-replace/i2v). t2i/t2v of the product is FORBIDDEN.
# ═══════════════════════════════════════════════════════════════════════════════
routing_matrix:
  image-ad:
    route: R1 (product-real / world-ai)
    draft:  { model: nano-banana, mode: bg-replace }     # compose real cutout → scene, iterate cheap
    final:  { model: flux-kontext, mode: bg-replace }     # cleanest fidelity for the ONE keeper
    finish: { model: kie-upscaler, mode: upscale }
    text:   post (typography-compositor) — never in-model
  banner:
    route: derive from ONE approved image master → crop/recompose per size (NO re-gen)
    master: { model: nano-banana, mode: bg-replace }
    text:   post
  3d-render:
    route: R1 studio-CGI look on the real cutout
    draft:  { model: nano-banana, mode: bg-replace }
    final:  { model: flux-kontext, mode: edit }
    note:   single front ref → face-on; true turntable needs more angles
  lp-hero-image:   { route: R1, draft: {model: nano-banana}, final: {model: flux-kontext}, text: post }
  lp-section-image:{ route: R1-batch, model: seedream, note: batch shared-style section imagery cheaply }
  lp-microvideo:
    route: R3 (i2v from approved keyframe), SHORT loop
    model: { draft: hailuo|seedance, final: kling|veo3-fast }
    loop: match first/last frame
  lp-3d-banner:
    route: R3 label-face-on micro-rotation (until more angles)
    model: kling (start+end frame)
  hero-video-ad:
    route: R3 (i2v) from the ONE approved, QC-passed keyframe
    keyframe: { draft: nano-banana, final: flux-kontext, mode: bg-replace }  # build the frame cheaply first
    animate:  { iterate: veo3-fast|kling, final: veo3 }                       # ONE final video gen
    audio:    veo3 native OR post sound-design (skill 53)
    text:     post (motion-graphics-compositor)

# ── Credit policy (enforced everywhere; full playbook in knowledge/kie-credit-optimization.md)
credit_policy:
  - image-first: build & QC the keyframe on a DRAFT image model before any video credit
  - text-in-post: Arabic never sent to the model (correctness + zero regen waste)
  - one-master-many-exports: crop/recompose sizes & ratios, never re-generate
  - draft→final: iterate at tier draft; spend tier final ONCE after QC ≥ 95
  - reference+seed lock: reuse product reference + fixed seed across the set
  - upscale-not-regenerate for resolution
  - short loopable microvideo on cheap video tier, not 8s hero renders
  - surface the bill: per-asset estimate + campaign total BEFORE spend, with a cheaper fallback each
