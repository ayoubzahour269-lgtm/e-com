# -----------------------------------------------------------------------------
hero_environment:
  arch: "warm cream Moorish / mihrab arch"         # the signature backdrop niche (Bible §4)
  drape: "deep garnet drape behind"                # (color = palette.deep_garnet) (Bible §4)
  hibiscus: "a single red hibiscus flower"         # one flower, echoes the ingredient (Bible §4)
  palm: "a palm frond"                             # heritage botanical (Bible §4)
  podium: "a pale stone / travertine podium"       # the bottle stands on this (Bible §4)
  light: "soft directional window light with long gentle shadows"   # warm, filmic (Bible §4)
  usage: "signature set for the product-hero and offer beats"       # (Bible §4, §6.1)
  mood: "warm, luxe, Moroccan-heritage-meets-Gulf, natural, premium"   # (Bible §3)


# -----------------------------------------------------------------------------
# negatives_ref — pointer to the always-applied negative-prompt core (Bible §6.6)
# The brand-lock does NOT restate the full negatives (they live once, canonically,
# with skill 24 and the prompt-builders). It POINTS to them and names the
# product-specific negatives that protect THIS bottle. Every compiled prompt
# appends the master core; skill 24 owns the merge (Bible §6.6, §8).
# -----------------------------------------------------------------------------
negatives_ref:
  canonical_source: "STUDIO-BIBLE.md §6.6 (master negative-prompt core)"
  owned_by_skill: "24-negative-prompt-builder"
  builder_path: "prompt-builders/"        # the compiler + negatives + dialect map live here (Bible §1)
  applies_to: "every compiled Kie prompt, always"   # never optional (Bible §6.6, §7)
  product_specific_negatives:             # the subset that guards THIS product_lock — mirrors §6.6 exactly
    - "morphing bottle"
    - "changing / warped label"
    - "altered logo"
    - "wrong Arabic"
    - "gibberish text"
    - "mismatched cap color"
    - "liquid color shift"
    - "subtitles burn-in"
    - "watermark"
  realism_negatives_note: >-
    The full master core (plastic/waxy skin, AI sheen, extra fingers/arms,
    malformed hands, warped face, uncanny/dead eyes, stiff mannequin motion,
    forced smile, floating objects, fake/detached shadows, flicker, frame jitter,
    temporal warping, oversaturation, HDR halos, CGI look, low-res/plastic hair,
    banding) is applied verbatim from Bible §6.6 by skill 24 — not duplicated here.
